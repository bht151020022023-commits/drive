<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love App 💙</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body{margin:0;font-family:Arial;background:radial-gradient(circle at 50% 40%,#00bfff 0%,#0f2027 70%);color:#fff;text-align:center}
.chat-card{width:320px;margin:auto;background:rgba(0,0,0,.75);padding:20px;border-radius:20px}
textarea,input{width:100%;border-radius:10px;padding:8px;margin-top:5px}
button{width:100%;padding:10px;border:none;border-radius:10px;color:#fff;margin-top:5px;background:#25d366}
.album{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
.album img{width:120px;border-radius:12px;cursor:pointer}
</style>
</head>

<body>

<h2>💙 Love App</h2>

<div class="chat-card">
<textarea id="messageInput"></textarea>
<button onclick="sendMessage()">Gửi tin nhắn</button>

<input type="file" id="fileInput" accept="image/*">
<button onclick="uploadToDrive()">📷 Tải ảnh lên Album</button>
</div>

<h3>📸 Album của chúng ta</h3>
<div class="album" id="album"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyBC9LMMYeDyZ3IPiIKcuynr586yawNkWhA",authDomain:"lo-ve-ffbd2.firebaseapp.com",projectId:"lo-ve-ffbd2"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

signInAnonymously(auth);

/* Chat */
window.sendMessage=async()=>{
 if(messageInput.value.trim()){
  await addDoc(collection(db,"loveChat"),{text:messageInput.value,time:Date.now()});
  messageInput.value="";
 }
};

/* Album load */
onSnapshot(collection(db,"loveAlbum"),snap=>{
 album.innerHTML="";
 snap.docs.sort((a,b)=>b.data().time-a.data().time)
 .forEach(d=>{
   const img=document.createElement("img");
   img.src=d.data().image;
   img.onclick=()=>window.open(img.src);
   album.appendChild(img);
 });
});

/* ===== Upload Drive ===== */
const CLIENT_ID="1037417752773-l2sg5hbdrdcs0jg47ur0j1htebkl52cl.apps.googleusercontent.com";
const SCOPES="https://www.googleapis.com/auth/drive.file";

window.uploadToDrive=async()=>{
 const file=document.getElementById("fileInput").files[0];
 if(!file) return alert("Chọn ảnh trước");

 const tokenClient=google.accounts.oauth2.initTokenClient({
  client_id:CLIENT_ID,
  scope:SCOPES,
  callback:async(resp)=>{
   if(resp.error) return alert("Lỗi đăng nhập Google");

   const form=new FormData();
   form.append("metadata",new Blob([JSON.stringify({name:file.name,mimeType:file.type})],{type:"application/json"}));
   form.append("file",file);

   const res=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",{
     method:"POST",
     headers:{Authorization:"Bearer "+resp.access_token},
     body:form
   });

   const data=await res.json();
   const imgLink=`https://drive.google.com/thumbnail?id=${data.id}&sz=w1200`;

   await addDoc(collection(db,"loveAlbum"),{image:imgLink,time:Date.now()});
   alert("Ảnh đã lưu và hiển thị!");
  }
 });

 tokenClient.requestAccessToken();
};
</script>
</body>
</html>
