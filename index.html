<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Album của tôi</title>
<script src="https://apis.google.com/js/api.js"></script>
<style>
body{font-family:sans-serif;background:#0f1b2b;color:#fff;text-align:center}
button{padding:10px 15px;border:none;border-radius:6px;margin:5px;background:#ff4d6d;color:#fff;cursor:pointer}
#gallery img{width:180px;margin:10px;border-radius:10px;cursor:pointer}
#viewer{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000d;justify-content:center;align-items:center}
#viewer img{max-width:90%;max-height:90%}
</style>
</head>

<body onload="gapiLoaded()">

<h1>📂 Album của tôi</h1>

<input type="file" id="fileInput" accept="image/*">
<button onclick="uploadToDrive()">Upload ảnh lên Drive</button>

<div id="gallery"></div>

<div id="viewer" onclick="this.style.display='none'">
  <img id="bigImg">
</div>

<script>
const CLIENT_ID = "1037417752773-l2sg5hbdrdcs0jg47ur0j1htebkl52cl.apps.googleusercontent.com";
const SCOPES = "https://www.googleapis.com/auth/drive.file";

let gapiInited = false;

function gapiLoaded() {
  gapi.load('client:auth2', async () => {
    await gapi.client.init({
      clientId: CLIENT_ID,
      scope: SCOPES,
      discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]
    });
    gapiInited = true;
  });
}

async function uploadToDrive(){
  if(!gapiInited){ alert("Chưa load Google API"); return; }

  const file = document.getElementById('fileInput').files[0];
  if(!file) return alert("Chọn ảnh trước");

  await gapi.auth2.getAuthInstance().signIn();

  const accessToken = gapi.auth.getToken().access_token;

  const metadata = { name: file.name, mimeType: file.type };
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(metadata)], {type: "application/json"}));
  form.append("file", file);

  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
    method: "POST",
    headers: new Headers({ Authorization: "Bearer " + accessToken }),
    body: form
  });

  const data = await res.json();
  const imgLink = `https://drive.google.com/thumbnail?id=${data.id}&sz=w1200`;

  addImage(imgLink);
}

function addImage(src){
  const img = document.createElement("img");
  img.src = src;
  img.onclick = ()=>showBig(src);
  document.getElementById("gallery").appendChild(img);
}

function showBig(src){
  document.getElementById("viewer").style.display="flex";
  document.getElementById("bigImg").src=src;
}
</script>

</body>
</html>
